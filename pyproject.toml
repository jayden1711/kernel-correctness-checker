[build-system]
requires = ["setuptools>=61", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "kernelchecker"
version = "0.1.0"
description = "Three-layer correctness verification and adversarial input search for Triton kernels"
requires-python = ">=3.10"

dependencies = [
    "torch>=2.3.0",
    "triton>=3.0.0; sys_platform == 'linux'",
    "litellm>=1.40.0",
    "python-dotenv>=1.0.0",
    "numpy>=1.26.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0.0",
    "pytest-cov>=5.0.0",
    "hypothesis>=6.100.0",
    "triton-viz>=0.3.0; sys_platform == 'linux'",
]

[project.scripts]
run-adversarial-search = "scripts.run_adversarial_search:main"

[tool.setuptools.packages.find]
where = ["."]
include = ["verification*", "scripts*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
python_classes = ["Test*"]
python_functions = ["test_*"]
addopts = "-v --tb=short --strict-markers -p no:warnings"
markers = [
    "gpu: requires CUDA device",
    "llm: requires live LLM API key (set CHECKER_LLM_TESTS=1)",
    "slow: slow integration tests >10s (set CHECKER_SLOW_TESTS=1)",
    "checker: three-layer checker pipeline tests",
    "adversarial: adversarial search system tests",
]

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "W", "I"]
ignore = ["E501"]